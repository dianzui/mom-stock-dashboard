name: 每日更新股票看板

on:
  schedule:
    # 兜底：北京时间 20:00 = UTC 12:00（周一到周五）
    # 主力由本机 launchd 每天 16:30 跑，这里只是 Mac 没开机时的后备
    - cron: '0 12 * * 1-5'
  workflow_dispatch:      # 也可以手动点一下触发

permissions:
  contents: write

env:
  TZ: Asia/Shanghai       # 让脚本里的时间显示为北京时间

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 采集行情与资金流
        run: |
          python build.py
          python gather_watch.py

      - name: 生成看板
        run: |
          python render.py
          cp dashboard.html index.html

      - name: 提交并发布
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --staged --quiet; then
            echo "内容无变化，跳过提交"
          else
            git commit -m "自动更新 $(TZ=Asia/Shanghai date +'%Y-%m-%d %H:%M')"
            git push
          fi
